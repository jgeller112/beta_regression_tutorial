name: Render paper with Nix and Quarto

on:
  push:
    branches-ignore:
      - rendered
    paths:
      - manuscript/ms.qmd
  pull_request:
    branches-ignore:
      - rendered
    paths:
      - manuscript/ms.qmd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-64:
    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

  # ... remainder 
    - name: Checkout main branch
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        logger: pretty
        log-directives: nix_installer=trace
        backtrace: full

    - name: Use rstats-on-nix cache
      uses: cachix/cachix-action@v15
      with:
        name: rstats-on-nix


    - name: Install MS fonts
      run: |
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y --no-install-recommends fontconfig ttf-mscorefonts-installer
        fc-cache -fv

    - name: Build development environment
      run: nix-build

    - name: Quarto render manuscript (PDF, DOCX, HTML)
      run: |
        nix-shell --run "quarto render manuscript/ms.qmd"

    - name: Copy full manuscript folder to temporary directory
      run: |
        mkdir -p out
        cp -r manuscript out/

    - name: Publish manuscript to rendered branch (single-commit, no history)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p publish
        cp -r out/manuscript publish/manuscript
        cd publish
        git init -q -b rendered
        git config user.name "GitHub Actions Bot"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Rendered manuscript folder [ci skip]"
        git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" rendered:rendered
